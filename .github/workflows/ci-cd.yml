name: CI/CD - DOSW Parcial T2

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: cobos1/dosw-parcial-t2

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  docker:
    name: Publicar imagen Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cobos1/dosw-parcial-t2:latest
            cobos1/dosw-parcial-t2:${{ github.sha }}

  deploy:
    name: Desplegar en Azure
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar contenedor
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dosw-parcial-cobos1-2026'
          images: 'cobos1/dosw-parcial-t2:${{ github.sha }}'
